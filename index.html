    <link rel="manifest" href="/site.webmanifest" />

      content="diseño web premium, desarrollo web, landing pages, estudio digital, paginas web para negocios locales, Valeris Studio"
    />

    <meta name="application-name" content="Valeris Studio" />
    <link rel="canonical" href="https://valerisstudio.es/" />
    <meta property="og:title" content="Valeris Studio | Diseño y desarrollo web premium" />

      property="og:description"
      content="Webs elegantes, rápidas y estratégicas para marcas que necesitan destacar con una presencia digital de mayor nivel."
    />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Valeris Studio | Diseño y desarrollo web premium" />
    <meta
      name="twitter:description"
      content="Webs elegantes, rápidas y estratégicas para marcas que necesitan destacar con una presencia digital de mayor nivel."
    />
    <meta name="twitter:image" content="https://valerisstudio.es/social-card.png" />
    <meta name="twitter:image:alt" content="Logo de Valeris Studio sobre fondo blanco" />
    <style>
      #entry-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        overflow: hidden;
        background: #000;
        color: #fff;
      }

      #entry-overlay.is-visible {
        display: block;
      }

      #entry-overlay .entry-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      #entry-overlay .entry-shade {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.38);
      }

      #entry-overlay .entry-shell {
        position: relative;
        display: flex;
        height: 100%;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px;
      }

      #entry-overlay .entry-brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      #entry-overlay .entry-logo {
        width: 56px;
        height: 56px;
        object-fit: contain;
      }

      #entry-overlay .entry-name {
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: #000;
        padding: 12px 16px;
        color: #fff;
        font-size: 1.875rem;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #entry-overlay .entry-center {
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: center;
      }

      #entry-overlay .entry-window-wrap {
        display: flex;
        width: 100%;
        max-width: 24rem;
        flex-direction: column;
        align-items: center;
      }

      #entry-overlay .entry-window {
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: #ededed;
        padding: 16px;
        text-align: center;
      }

      #entry-overlay .entry-window-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.14);
        padding-bottom: 12px;
      }

      #entry-overlay .entry-warning {
        color: #000;
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      #entry-overlay .entry-dots {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #entry-overlay .entry-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
      }

      #entry-overlay .entry-dot-red {
        background: #ff2a1f;
      }

      #entry-overlay .entry-dot-mid {
        background: rgba(255, 255, 255, 0.4);
      }

      #entry-overlay .entry-dot-low {
        background: rgba(255, 255, 255, 0.2);
      }

      #entry-overlay .entry-title {
        margin-top: 12px;
        color: #000;
        font-size: 0.875rem;
        line-height: 1.02;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      #entry-overlay .entry-line {
        display: block;
      }

      #entry-overlay .entry-button {
        margin-top: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 0;
        background: #ff2a1f;
        padding: 10px 20px;
        color: #fff;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
      }

      @media (min-width: 640px) {
        #entry-overlay .entry-shell {
          padding: 32px;
        }

        #entry-overlay .entry-name {
          font-size: 2.25rem;
        }

        #entry-overlay .entry-window {
          padding: 20px;
        }

        #entry-overlay .entry-title {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="entry-overlay" aria-hidden="true">
      <img class="entry-bg" src="/entry-bg.gif" alt="" />
      <div class="entry-shade"></div>
      <div class="entry-shell">
        <div class="entry-brand">
          <img class="entry-logo" src="/logo.png" alt="Logo Valeris Studio" />
          <p class="entry-name">Valeris Studio</p>
        </div>
        <div class="entry-center">
          <div class="entry-window-wrap">
            <div class="entry-window">
              <div class="entry-window-top">
                <p class="entry-warning">Warning</p>
                <div class="entry-dots">
                  <span class="entry-dot entry-dot-red"></span>
                  <span class="entry-dot entry-dot-mid"></span>
                  <span class="entry-dot entry-dot-low"></span>
                </div>
              </div>
              <p class="entry-title" aria-hidden="true">
                <span class="entry-line">ESTAS A PUNTO</span>
                <span class="entry-line">DE CONSEGUIR</span>
                <span class="entry-line">TU MEJOR WEB</span>
              </p>
            </div>
            <button id="entry-overlay-button" class="entry-button" type="button">
              Entrar
              <span>→</span>
            </button>
          </div>
        </div>
        <div></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var overlay = document.getElementById('entry-overlay');
        var button = document.getElementById('entry-overlay-button');
        var isHome = window.location.pathname === '/';

        if (!overlay || !button || !isHome) {
          return;
        }

        overlay.classList.add('is-visible');
        document.body.style.overflow = 'hidden';

        button.addEventListener('click', function () {
          overlay.classList.remove('is-visible');
          document.body.style.overflow = '';
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
